name: Daily sync (SaleHistory -> Supabase)

on:
  schedule:
    # GitHub Actions schedule uses UTC.
    # Pacific/Auckland is UTC+12 (NZST) or UTC+13 (NZDT), so 02:00 local is 13:00 or 14:00 UTC.
    # We run twice to cover DST automatically. Upsert makes it safe if both hit.
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call sync endpoint
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "Missing secrets.CRON_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing secrets.CRON_SECRET"
            exit 1
          fi
          curl -sS -X POST "$CRON_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json" \
            --data '{}' \
            --fail-with-body
